{% extends "base.html" %}
{% block title %}登录 — 到手价监控{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto;">
  <h1>管理登录</h1>
  <p class="muted">已启用 ADMIN_TOKEN，请输入令牌（也可通过 Header <code>X-Admin-Token</code>）。</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="grid">
    <div>
      <label for="token">Admin Token</label>
      <input type="password" id="token" name="token" required autofocus />
    </div>
    <button class="btn" type="submit">登录</button>
  </form>
</div>
{% endblock %}
