# price-watch — 到手价监控（单容器：FastAPI + QQ 官方 Bot）
# 用法：cp config.example.yaml config.yaml && cp .env.example .env
#       在 QQ 开放平台后台手动添加可聊天用户；.env 填 QQ_BOT_APP_ID / QQ_BOT_SECRET
#       docker compose up -d --build
#
# 仅发布 Web 端口（默认宿主机 8080）。Bot 用 QQ WebSocket 出站，notify 仅容器内 localhost。
# 请务必设置 ADMIN_TOKEN。

services:
  app:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.cloud.tencent.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: price-watch:latest
    container_name: price-watch
    restart: unless-stopped
    ports:
      # 远程调试需要 0.0.0.0；若只想本机访问可改回 "127.0.0.1:8080:8080"
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/pricewatch.db}
      # 单容器内本机互通
      APP_API_BASE: ${APP_API_BASE:-http://127.0.0.1:8080}
      BOT_NOTIFY_URL: ${BOT_NOTIFY_URL:-http://127.0.0.1:8091/notify}
      BOT_NOTIFY_PORT: "8091"
      # 运行时出站代理（京东抓取 / 短链展开）；可选 JD_HTTP_PROXY 覆盖
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      JD_HTTP_PROXY: ${JD_HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
