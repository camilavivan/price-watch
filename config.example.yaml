# price-watch 配置示例 — 复制为 config.yaml 后修改
# 切勿把真实 AppID/Secret 提交到 Git；优先用环境变量 QQ_BOT_APP_ID / QQ_BOT_SECRET

# 管理端鉴权：留空则本机无鉴权；设置后需 Cookie/Header: X-Admin-Token
# Bot 调内部 API、以及 app→bot 告警推送也会带此 Token
adminToken: ""

# 数据库（也可由环境变量 DATABASE_URL 覆盖）
databaseUrl: "sqlite+aiosqlite:///./data/pricewatch.db"

# 调试/管理 Web（compose 默认映射宿主机 8080；容器内监听 0.0.0.0）
# 远程访问时请设置 adminToken 或环境变量 ADMIN_TOKEN
web:
  host: 0.0.0.0
  port: 8080

# 调度器
scheduler:
  defaultIntervalMinutes: 60
  startupDelaySeconds: 10
  # needs_manual + 风控类 last_error 时，跳过自动抓取的小时数（防刷京东）
  manualRiskBackoffHours: 12

# 抓取礼貌限速（平台 adapter 请求之间）
fetch:
  rateLimitSeconds: 1.5
  priceNoisePercent: 0.5   # 小于该幅度的波动不触发「较上次下降」类告警
  minPlausiblePrice: 10    # 手动/抓取/软提示价低于此则拒绝（除非 force 或带 ￥/元 标注）
  historyBogusFraction: 0.2  # 候选价 < 历史最低 × 该比例 → 视为误识别
  # 可选：Playwright 浏览器取价（京东风控/SPA；需镜像安装 chromium，体积显著增大）
  playwright:
    enabled: false
    headless: true
    storageStatePath: "./data/browser/jd_storage.json"
    userDataDir: "./data/browser/profile"
    loginScreenshotPath: "./data/browser/login.png"
    timeoutMs: 45000
    preferMobile: true

# 到手价告警默认规则（商品可覆盖）
alerts:
  onBelowTarget: true
  dropPercent: 5
  dropYuan: 0
  # 自采历史：每次成功抓价写入 price_history，按窗口统计最低/均价/最高
  onHistoryLow: true
  historyLowDays: 90          # 回看天数，常用 30 / 90 / 180
  historyLowTolerancePercent: 0.5  # 当前价在最低价 0.5% 内视为历史新低


# 价格历史：外部（慢慢买 best-effort）优先展示；本地 price_history 作兜底与告警快照
history:
  enabled: true
  external: manmanbuy   # manmanbuy | none
  cacheSeconds: 3600
  rateLimitSeconds: 2.0
  # 京东/淘宝自动取价失败时，用慢慢买最新点作软参考价（VPS 常返回 402/403 则跳过；仍可用「填价」覆盖）
  softPriceHint: true
  softPriceHintPlatforms: ["jd", "taobao"]

# QQ 官方开放平台 Bot（主路径）
# 使用 WebSocket 出站，无需公网入站端口 / webhook
qqofficial:
  enabled: true
  appId: ""               # 或环境变量 QQ_BOT_APP_ID
  secret: ""              # 或环境变量 QQ_BOT_SECRET
  sandbox: false          # 首次联调可改 true
  mode: websocket         # 固定 websocket，不要用 webhook（否则要暴露端口）
  sendImages: true        # 告警/详情配图；失败回退纯文字
  # allowUsers / allowAll：已废弃。个人开发者只能在 QQ 开放平台后台手动加人；
  # 能聊到机器人的用户一律放行，监控按 owner_openid 隔离。
  # allowUsers: []
  # allowAll: false
  # 同容器内 app→bot 告警推送（勿改成其他主机名）
  notifyUrl: "http://127.0.0.1:8091/notify"

# OneBot v11（已降级，默认关闭；主路径为 qqofficial）
onebot:
  enabled: false
  apiBase: "http://host.docker.internal:5700"
  accessToken: ""
  notifyGroups: []
  notifyUsers: []

# 微信 / 企业微信：不做产品路径（已移除）


# 京东联盟开放平台（可选 stub；MVP 不依赖，后续可接官方价）
jdUnion:
  enabled: false
  appKey: ""
  appSecret: ""
